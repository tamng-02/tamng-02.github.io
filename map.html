<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin:0; padding:0; width:100%; height:100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = L.map('map', { scrollWheelZoom: false }).setView([44, 8], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(map);

  const stops = [
    { coords: [49.545, 9.376],     label: '🏡 Schneeberg',  note: 'Grew up here.' },
    { coords: [40.4168, -3.7038],  label: '🇪🇸 Madrid',      note: 'Selectra · 2021–2022' },
    { coords: [52.52, 13.405],     label: '🏙️ Berlin',       note: 'HWR Berlin · home since 2022' },
    { coords: [31.2304, 121.4737], label: '🥟 Shanghai',     note: 'Exchange semester · 2024–2025' },
  ];

  L.polyline(
    [[49.545,9.376],[40.4168,-3.7038],[52.52,13.405],[31.2304,121.4737],[52.52,13.405]],
    { color: '#ffb5a7', weight: 2, dashArray: '5,5' }
  ).addTo(map);

  stops.forEach(s => {
    L.marker(s.coords, {
      icon: L.divIcon({ html: `<div style="font-size:20px">${s.label.slice(0,2)}</div>`, className:'', iconSize:[24,24], iconAnchor:[12,12] })
    }).addTo(map).bindPopup(`<b>${s.label}</b><br><span style="font-size:0.85rem;color:#888">${s.note}</span>`);
  });
</script>
</body>
</html>
