<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Tam Nguyen" }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body  { font-family:'Nunito',sans-serif; max-width:680px; margin:0 auto; padding:0 24px 60px; background:#fff9f6; color:#444; line-height:1.8; }
    .bar  { height:6px; margin:0 -24px 36px; background:linear-gradient(90deg,#ffb5a7,#ffd6a5,#caffbf,#a0c4ff,#cdb4db); }
    h1    { font-size:2rem; color:#333; margin-bottom:4px; }
    h3    { color:#ffb5a7; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; margin:32px 0 8px; }
    hr    { border:none; border-top:1px solid #f0e8e4; margin:24px 0; }
    img   { border-radius:10px; max-width:100%; display:block; }
    table { border-collapse:collapse; width:100%; font-size:0.9rem; }
    td,th { padding:6px 10px; border-bottom:1px solid #f0e8e4; }
    th    { color:#ffb5a7; text-align:left; }
    a     { color:#ffb5a7; }
    footer{ margin-top:40px; font-size:0.82rem; color:#ccc; text-align:center; }
  </style>
</head>
<body>
  <div class="bar"></div>
  {{ content }}
  <footer><a href="https://www.linkedin.com/in/tamdoannguyen">LinkedIn</a> &nbsp;·&nbsp; HWR Berlin · Prof. Loecher</footer>
</body>
</html>
