<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Tam Nguyen" }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body   { font-family:'Nunito',sans-serif; max-width:680px; margin:0 auto; padding:0 24px 60px; background:#fff9f6; color:#444; line-height:1.8; }
    .bar   { height:6px; margin:0 -24px 44px; background:linear-gradient(90deg,#ffb5a7,#ffd6a5,#caffbf,#a0c4ff,#cdb4db); }

    h1     { font-size:2.4rem; color:#222; font-weight:800; margin-bottom:2px; }
    h1 + p { color:#aaa; font-size:0.92rem; margin-bottom:0; }

    h3     { color:#ffb5a7; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.13em;
             margin:40px 0 14px; padding-left:10px; border-left:3px solid #ffb5a7; }

    hr     { border:none; border-top:1px solid #f0e8e4; margin:30px 0; }
    p      { color:#555; margin-bottom:10px; }

    img              { border-radius:12px; max-width:100%; display:block;
                       box-shadow:0 2px 16px rgba(0,0,0,0.09); }
    img.profile      { width:140px; height:140px; border-radius:50%; object-fit:cover;
                       object-position:center 15%; margin:20px auto 28px;
                       border:3px solid #ffb5a7;
                       box-shadow:0 4px 20px rgba(255,181,167,0.4); }

    table  { border-collapse:collapse; width:100%; font-size:0.88rem; margin-top:4px; }
    thead  { background:#fff5f3; }
    td,th  { padding:9px 12px; border-bottom:1px solid #f0e8e4; vertical-align:top; }
    th     { color:#ffb5a7; font-weight:700; text-align:left; }
    tbody tr:hover { background:#fffaf8; }

    iframe { border-radius:12px; margin-top:10px; display:block;
             box-shadow:0 2px 16px rgba(0,0,0,0.09); }

    a      { color:#ffb5a7; }
    footer { margin-top:44px; font-size:0.82rem; color:#ccc; text-align:center; }
  </style>
</head>
<body>
  <div class="bar"></div>
  {{ content }}
  <footer><a href="https://www.linkedin.com/in/tamdoannguyen">LinkedIn</a> &nbsp;·&nbsp; HWR Berlin · Prof. Loecher</footer>
</body>
</html>
