<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Tam Nguyen" }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body   { font-family:'Nunito',sans-serif; max-width:700px; margin:0 auto; padding:0 28px 80px;
             background:#fff9f6; color:#444; line-height:1.85; counter-reset:section; }

    .bar   { height:7px; margin:0 -28px 56px;
             background:linear-gradient(90deg,#ffb5a7,#ffd6a5,#caffbf,#a0c4ff,#cdb4db,#ffb5a7);
             background-size:200%; animation:slide 4s linear infinite; }
    @keyframes slide { to { background-position:200%; } }

    h1     { font-size:3.2rem; font-weight:900; letter-spacing:-0.03em; margin-bottom:4px; line-height:1.1;
             background:linear-gradient(135deg,#ff8c7a,#ffb5a7,#cdb4db);
             -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    h1 + p { color:#bbb; font-size:0.9rem; margin-bottom:0; }

    h3     { counter-increment:section; margin:52px 0 18px; display:flex; align-items:baseline; gap:14px; }
    h3::before { content:"0" counter(section);
                 font-size:3rem; font-weight:900; color:#f5ede9; line-height:1;
                 letter-spacing:-0.04em; flex-shrink:0; }

    hr     { border:none; border-top:1px solid #f0e8e4; margin:32px 0; }
    p      { color:#555; margin-bottom:10px; }

    img              { border-radius:14px; max-width:100%; display:block;
                       box-shadow:0 4px 24px rgba(0,0,0,0.09);
                       transition:transform .3s ease, box-shadow .3s ease; }
    img:hover        { transform:scale(1.015); box-shadow:0 8px 32px rgba(0,0,0,0.14); }
    img.profile      { width:130px; height:130px; border-radius:50%; object-fit:cover;
                       object-position:center 15%; margin:24px auto 32px;
                       border:4px solid white;
                       box-shadow:0 0 0 3px #ffb5a7, 0 8px 28px rgba(255,181,167,0.4); }
    img.profile:hover { transform:scale(1.04); }

    table  { border-collapse:collapse; width:100%; font-size:0.88rem; margin-top:4px; }
    thead  { background:#fff5f3; }
    td,th  { padding:10px 14px; border-bottom:1px solid #f0e8e4; vertical-align:top; }
    th     { color:#ffb5a7; font-weight:800; text-align:left; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; }
    tbody tr:hover { background:#fffaf8; }

    iframe { border-radius:14px; display:block;
             box-shadow:0 4px 24px rgba(0,0,0,0.09); margin-top:12px; }

    a      { color:#ffb5a7; text-decoration:none; font-weight:600; }
    footer { margin-top:52px; font-size:0.82rem; color:#ccc; text-align:center; }
  </style>
</head>
<body>
  <div class="bar"></div>
  {{ content }}
  <footer><a href="https://www.linkedin.com/in/tamdoannguyen">LinkedIn</a> &nbsp;·&nbsp; HWR Berlin · Prof. Loecher</footer>
</body>
</html>
